# MXWatch API CI/CD: lint y test en paralelo, deploy a Dokploy (VPS) solo en push a main
name: MXWatch API CI/CD

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: lint y verificación de formato con Biome
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Verifica formato y lint con Biome (sin escribir archivos)
      - name: Format & lint check
        run: bun run check

  # Job 2: pruebas (placeholder, sin tests configurados por ahora)
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Ejecuta la suite de pruebas
      - name: Run tests
        run: bun run test

  # Job 3: despliegue en Dokploy (VPS) solo en push a main
  deploy:
    name: Deploy to Dokploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      # 1. Dispara el deploy en Dokploy vía SSH
      - name: Trigger Dokploy deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Iniciando despliegue de mxwatch-api en Dokploy..."
            curl -X POST 'http://localhost:3000/api/application.deploy' \
              -H 'Content-Type: application/json' \
              -H 'x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}' \
              -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}"}'
            echo "Despliegue completado exitosamente!"
