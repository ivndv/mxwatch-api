# MXWatch API CI/CD: lint, tipos y build de imagen; deploy a Dokploy solo en push a main
name: MXWatch API CI/CD

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: lint y verificación de formato con Biome
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Verifica formato y lint con Biome (sin escribir archivos)
      - name: Format & lint check
        run: bun run check

  # Job 2: verificación de tipos con el compilador de TypeScript
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Valida los tipos sin emitir archivos
      - name: Typecheck
        run: bun run typecheck

  # Job 3: construye la imagen Docker para detectar fallos antes del despliegue
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Compila la imagen sin publicarla
      - name: Build image
        run: docker build --tag mxwatch-api:ci .

  # Job 4: despliegue en Dokploy (VPS) solo en push a main.
  # Sin SSH: el webhook se llama por HTTPS y Cloudflare Access lo autentica
  # con un Service Token acotado a /api/deploy/*.
  deploy:
    name: Deploy to Dokploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, typecheck, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Dispara el deploy en Dokploy vía webhook autenticado
      - name: Deploy via Dokploy webhook (Cloudflare Access)
        env:
          DOKPLOY_DEPLOY_TOKEN: ${{ secrets.DOKPLOY_DEPLOY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST "https://dokploy.fluxdv.icu/api/deploy/${DOKPLOY_DEPLOY_TOKEN}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-github-event: push" \
            -H "content-type: application/json" \
            -d '{"ref":"refs/heads/main","commits":[{"added":[],"modified":["README.md"],"removed":[]}],"head_commit":{"message":"Deploy from CI"}}'
          echo
          echo "Deploy solicitado a Dokploy."

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
