# MXWatch API CI/CD — lint -> test -> deploy (Dokploy VPS solo en push a main)
# Flujo: push/PR a main/develop dispara lint y test en paralelo; deploy solo en main

name: MXWatch API CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # lint: Biome lint + format — fail fast, bloquea deploy
  lint:
    name: Lint & Formato (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Configurar runtime de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Caché de node_modules basado en el hash del lockfile para acelerar el pipeline
      - name: Restaurar / Guardar caché de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependencias con Bun
        run: bun install

      - name: Ejecutar linter con Biome
        run: bun run lint

      - name: Verificar formato de código con Biome
        run: bun run check

  # test: suite de pruebas automatizadas
  test:
    name: Pruebas Automatizadas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Configurar runtime de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Caché de node_modules reutilizado entre jobs concurrentes
      - name: Restaurar / Guardar caché de node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependencias con Bun
        run: bun install

      - name: Ejecutar suite de pruebas
        run: bun run test

  # deploy: Dokploy VPS solo en push a main y con todo verde
  deploy:
    name: Despliegue en VPS (Dokploy)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar trigger de despliegue vía Dokploy API por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Iniciando despliegue de mxwatch-api en Dokploy..."
            curl -X POST 'http://localhost:3000/api/application.deploy' \
              -H 'Content-Type: application/json' \
              -H 'x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}' \
              -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}"}'
            echo "Despliegue completado exitosamente!"
